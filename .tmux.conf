# --- Base Settings ---
set-option -g base-index 0
set-option -g mouse on
set-option -g renumber-windows on
set-option -g status-position top

# --- Status Bar Refresh & Styling ---
set -g status-interval 5

# Set the main bar to a soft charcoal (no more green)
set -g status-style bg=colour236,fg=white

# --- Right Side: [Hostname] + [CPU Stats] ---
set -g status-right-length 150

# Format: [Hostname in Violet] [CPU script in Dark Grey]
set -g status-right "#[bg=colour135,fg=colour232,bold] #H #[bg=colour238,fg=white,nobold] #(~/.config/tmux/tmux_status.sh) "

# Clear out status-left so it doesn't clutter the bar
set -g status-left ""
