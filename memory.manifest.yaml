# memory.manifest.yaml — lives at the repo root of each service.
#
# Purpose: declares this repo's memory scope and its dependencies so the
# agent's READ scope is DECLARED, not guessed. The `dependencies` list below
# is also the canonical-name menu: the agent files cross-cutting facts by
# picking from these, and must not invent new names.
#
# PROVISIONAL — re-scoped by KAN-19 (2026-08-17), flag for human review.
# `project` is scoped to `project/dotfiles` (the repo as a whole); this repo
# no longer owns a separate sub-project or any cross-service chat integration.

domain: harness              # innkeeper | harness — hard boundary
project: project/dotfiles    # this repo's own scope

# Shared dependencies this service touches. Names here are canonical — they map
# 1:1 to dep/<name> notes in the memory store. Add a dep here BEFORE writing a
# fact about it, so naming stays consistent across projects.
dependencies:
  - dep/opencode      # opencode CLI/server harness (SSE /event, session API) that runs each session

# Cross-cutting scopes always loaded on top of the above. Keep the global tier
# thin — infra/tooling only.
always_load:
  - harness/global     # org-wide harness-domain invariants (rare)
  - global/infra        # gitea, doks, litellm — cross-domain infra

# Resolved READ scope for any ticket in this repo is the union of:
#   project + dependencies + always_load
# The agent loads exactly this set and no more. Do not widen at runtime;
# add scopes here if a new dependency is introduced.
