# --- Base Settings ---
set-option -g base-index 0
set-option -g mouse on
set-option -g renumber-windows on
set-option -g status-position top

# --- Status Bar Refresh & Styling ---
set -g status-interval 5

# Set the main bar to a soft charcoal (no more green)
set -g status-style bg=colour236,fg=white

# --- Right Side: [Hostname] + [CPU Stats] ---
set -g status-right-length 150

# Format: [Hostname in Violet] [CPU script in Dark Grey]
set -g status-right "#[bg=colour135,fg=colour232,bold] #H #[bg=colour238,fg=white,nobold] #(~/.config/tmux/tmux_status.sh) "

# Clear out status-left so it doesn't clutter the bar
set -g status-left ""

# Pane titles
#set -g pane-border-status top
#set -g pane-border-format "[ #{pane_title} ]"

# Make pane borders stand out without pane-border-status (mouse resize
# breaks with it on tmux 3.6 -- https://github.com/tmux/tmux/issues/4715)
set -g pane-border-lines heavy
set -g pane-border-style fg=colour136
set -g pane-active-border-style fg=colour226

# Active window: Bold text on the Violet background (matches Hostname)
set-window-option -g window-status-current-style fg=colour232,bg=colour135,bold
set-window-option -g window-status-current-format " #I:#W "

# The centered dot separator with padding for breathing room
set-window-option -g window-status-separator "  •  "

# Pass clipboard through
set -s set-clipboard on
set -g allow-passthrough on

# Allow for apps to detect when they've gained focus
set -g focus-events on
